<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Attendance</title>
</head>
<body>
    <h2>Scan the QR Code for Attendance</h2>
    <img id="qr-image" src="/static/qr_code.png" alt="QR Code" width="300">
    
    <button onclick="submitAttendance()">Mark Attendance</button>

    <script>
        function refreshQR() {
            fetch('/generate_qr')
            .then(response => response.json())
            .then(data => {
                document.getElementById('qr-image').src = data.qr_url + "?" + new Date().getTime();
            });
        }

        function submitAttendance() {
            navigator.geolocation.getCurrentPosition(function(position) {
                let lat = position.coords.latitude;
                let lon = position.coords.longitude;
                let studentId = prompt("Enter your student ID:");
                
                fetch('/mark_attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        student_id: studentId, 
                        qr_code: document.getElementById('qr-image').src, 
                        latitude: lat, 
                        longitude: lon 
                    })
                })
                .then(response => response.json())
                .then(data => alert(data.message || data.error));
            }, function(error) {
                alert("GPS access is required for attendance!");
            });
        }
        refreshQR()
        setInterval(refreshQR, 10000);  // Refresh QR every 30 sec
    </script>
</body>
</html>
